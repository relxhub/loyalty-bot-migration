<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0a0a">
    <title>ONEHUB · Admin</title>
    <link rel="icon" type="image/png" href="logo.png">

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

    <style>
        :root { --bg:#0a0a0a; --secondary-bg:#161616; }
        html, body { overscroll-behavior-y: none; }
        body { background: var(--bg); color: white; font-family: 'Kanit', sans-serif; -webkit-tap-highlight-color: transparent; }
        .glass-card { background: var(--secondary-bg); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; }
        ::-webkit-scrollbar { width: 0; background: transparent; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        .no-scroll { overflow: hidden; }
        .role-badge { padding: 2px 10px; border-radius: 999px; font-size: 10px; font-weight: 700; letter-spacing: .5px; }
        .role-Owner { background: linear-gradient(90deg,#fbbf24,#f59e0b); color: #1a1a1a; }
        .role-SuperAdmin { background: rgba(168,85,247,0.25); color: #d8b4fe; border: 1px solid rgba(168,85,247,0.5); }
        .role-Admin { background: rgba(59,130,246,0.25); color: #93c5fd; border: 1px solid rgba(59,130,246,0.5); }
        .item-fade-in { opacity: 0; animation: fu .35s ease-out forwards; }
        @keyframes fu { from { opacity:0; transform: translateY(6px); } to { opacity:1; transform: translateY(0); } }
        .status-pill { padding: 2px 8px; border-radius: 999px; font-size: 10px; font-weight: 600; }
        .status-PENDING { background: rgba(234,179,8,0.2); color: #fde68a; }
        .status-SHIPPED { background: rgba(34,197,94,0.2); color: #bbf7d0; }
        .status-DELIVERED { background: rgba(59,130,246,0.2); color: #bfdbfe; }
        .status-active { background: rgba(34,197,94,0.2); color: #bbf7d0; }
        .status-inactive { background: rgba(115,115,115,0.3); color: #d4d4d4; }
        .switch { position: relative; display: inline-block; width: 38px; height: 22px; }
        .switch input { opacity:0; width:0; height:0; }
        .slider { position: absolute; cursor: pointer; inset:0; background:#3f3f46; border-radius:999px; transition:.2s; }
        .slider:before { position:absolute; content:""; height:16px; width:16px; left:3px; bottom:3px; background:white; border-radius:50%; transition:.2s; }
        .switch input:checked + .slider { background:#22c55e; }
        .switch input:checked + .slider:before { transform: translateX(16px); }
        .menu-card { transition: transform 0.15s ease, background 0.2s; }
        .menu-card:active { transform: scale(0.97); }
    </style>
</head>
<body class="p-4">
    <div id="loading-screen" class="fixed inset-0 z-30 bg-black flex items-center justify-center">
        <div class="text-center">
            <div class="text-5xl mb-3">🛡️</div>
            <p class="text-zinc-400" id="loading-text">กำลังตรวจสิทธิ์...</p>
        </div>
    </div>

    <div id="forbidden" class="hidden fixed inset-0 z-30 bg-black flex flex-col items-center justify-center p-6 text-center">
        <div class="text-6xl mb-4">🚫</div>
        <h1 class="text-xl font-bold mb-2">ไม่มีสิทธิ์เข้าถึง</h1>
        <p class="text-sm text-zinc-400 mb-6">หน้านี้สำหรับ Admin / SuperAdmin / Owner เท่านั้น</p>
        <a href="home.html" class="px-6 py-3 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-white font-bold">กลับหน้าหลัก</a>
    </div>

    <div id="app" class="hidden w-full max-w-md mx-auto pb-24">
        <!-- Top bar -->
        <div class="flex items-center justify-between mb-4 pt-2">
            <div class="flex items-center gap-2">
                <button id="back-btn" onclick="goHome()" class="hidden w-9 h-9 rounded-full bg-white/5 border border-white/10 flex items-center justify-center hover:bg-white/10">
                    <i class="ri-arrow-left-s-line text-xl"></i>
                </button>
                <div>
                    <div class="text-[10px] text-zinc-500 uppercase tracking-widest">Admin Console</div>
                    <div class="flex items-center gap-2 mt-0.5">
                        <div class="text-base font-bold text-white" id="admin-name">—</div>
                        <span id="admin-role" class="role-badge">—</span>
                    </div>
                </div>
            </div>
            <a href="home.html" class="w-10 h-10 rounded-full bg-white/5 border border-white/10 flex items-center justify-center hover:bg-white/10" aria-label="Exit">
                <i class="ri-logout-box-r-line text-lg"></i>
            </a>
        </div>

        <!-- HOME view -->
        <div id="view-home" class="space-y-3">
            <button onclick="showView('orders')" class="menu-card w-full glass-card p-4 flex items-center gap-3 text-left">

                <div class="flex-1">
                    <div class="font-bold text-white text-sm">จัดการออเดอร์</div>
                    <div class="text-[11px] text-zinc-400">ตรวจสลิป · ใส่บิล · จัดส่ง</div>
                </div>
                <span id="badge-orders" class="hidden text-[10px] bg-red-500 text-white rounded-full min-w-[20px] h-5 px-1.5 flex items-center justify-center font-bold">0</span>
                <i class="ri-arrow-right-s-line text-zinc-400"></i>
            </button>

            <button onclick="showView('shipments')" class="menu-card w-full glass-card p-4 flex items-center gap-3 text-left">
                <div class="w-12 h-12 rounded-xl bg-orange-500/20 flex items-center justify-center text-2xl">📦</div>
                <div class="flex-1">
                    <div class="font-bold text-white text-sm">จัดส่งของรางวัล</div>
                    <div class="text-[11px] text-zinc-400">Mystery Box prize shipments</div>
                </div>
                <span id="badge-shipments" class="hidden text-[10px] bg-red-500 text-white rounded-full min-w-[20px] h-5 px-1.5 flex items-center justify-center font-bold">0</span>
                <i class="ri-arrow-right-s-line text-zinc-400"></i>

            <button onclick="showView('customers')" class="menu-card w-full glass-card p-4 flex items-center gap-3 text-left">

                <div class="flex-1">

            <button onclick="showView('coupons')" class="menu-card w-full glass-card p-4 flex items-center gap-3 text-left">

                <div class="flex-1">

                    <div class="text-[11px] text-zinc-400">เปิด/ปิดคูปอง</div>

                <div class="flex-1">

        <!-- 📊 Dashboard view (Owner only) -->

            <input id="ord-search" type="text" placeholder="ค้นหา: รหัสออเดอร์ / ลูกค้า / เบอร์ / ชื่อ" class="w-full bg-white/5 border border-white/10 rounded-xl p-2.5 text-sm text-white placeholder-zinc-500 focus:border-emerald-400 focus:outline-none mb-2">

                <button data-status="PROCESSING" class="ord-tab whitespace-nowrap text-xs px-3 py-1.5 rounded-full bg-white/5 text-zinc-400 border border-white/10">กำลังเตรียม <span data-count="PROCESSING">0</span></button>
                <button data-status="SHIPPED" class="ord-tab whitespace-nowrap text-xs px-3 py-1.5 rounded-full bg-white/5 text-zinc-400 border border-white/10">ส่งแล้ว</button>

                <div class="flex gap-1">
                    <button data-status="PENDING" class="ship-tab status-pill status-PENDING">รอจัดส่ง <span data-count="PENDING">0</span></button>
                    <button data-status="SHIPPED" class="ship-tab status-pill status-SHIPPED">จัดส่งแล้ว</button>

    <!-- Ship Modal -->

            <div class="text-xs text-zinc-400 mb-3">Shipment <span id="ship-modal-id" class="text-white font-mono">#</span></div>

            <div class="flex gap-2">

                <button id="ship-modal-submit" onclick="submitShipModal()" class="flex-1 py-2.5 rounded-xl bg-orange-500 hover:bg-orange-400 text-white text-sm font-bold disabled:opacity-50">ยืนยัน</button>

        </div>
    </div>

    <!-- Customer Detail Modal -->
    <div id="cust-modal" class="hidden fixed inset-0 z-[80] flex items-end sm:items-center justify-center bg-black/85 backdrop-blur-sm">
        <div id="cust-modal-content" class="glass-card w-full max-w-md max-h-[92vh] overflow-y-auto p-5 rounded-t-3xl sm:rounded-2xl"></div>
    </div>

    <!-- 🎁 Mystery Box Edit Modal -->
    <div id="mbox-modal" class="hidden fixed inset-0 z-[80] flex items-end sm:items-center justify-center bg-black/85 backdrop-blur-sm">
        <div id="mbox-modal-content" class="glass-card w-full max-w-md max-h-[92vh] overflow-y-auto p-5 rounded-t-3xl sm:rounded-2xl"></div>
    </div>

    <!-- Prize Edit Modal -->
    <div id="prize-modal" class="hidden fixed inset-0 z-[90] flex items-end sm:items-center justify-center bg-black/85 backdrop-blur-sm">
        <div id="prize-modal-content" class="glass-card w-full max-w-sm p-5 rounded-t-3xl sm:rounded-2xl"></div>
    </div>

    <!-- 🎫 Coupon Edit Modal -->
    <div id="cpn-modal" class="hidden fixed inset-0 z-[80] flex items-end sm:items-center justify-center bg-black/85 backdrop-blur-sm">
        <div id="cpn-modal-content" class="glass-card w-full max-w-md max-h-[92vh] overflow-y-auto p-5 rounded-t-3xl sm:rounded-2xl"></div>
    </div>

    <!-- Adjust Points Modal -->
    <div id="adj-modal" class="hidden fixed inset-0 z-[90] flex items-center justify-center bg-black/85 backdrop-blur-sm p-4">
        <div class="glass-card w-full max-w-sm p-5">
            <h3 class="text-base font-bold mb-1">ปรับแต้มลูกค้า</h3>
            <div class="text-xs text-zinc-400 mb-3"><span id="adj-modal-cust" class="text-white font-mono">—</span></div>
            <label class="text-xs text-zinc-300 block mb-1">จำนวนแต้ม (+/-)</label>
            <input id="adj-modal-delta" type="number" placeholder="เช่น 100 หรือ -50" class="w-full bg-black/40 border border-white/10 rounded-lg p-2 text-sm text-white focus:border-blue-400 focus:outline-none mb-3">
            <label class="text-xs text-zinc-300 block mb-1">เหตุผล (optional)</label>
            <input id="adj-modal-reason" type="text" placeholder="เช่น ชดเชยเหตุการณ์" class="w-full bg-black/40 border border-white/10 rounded-lg p-2 text-sm text-white focus:border-blue-400 focus:outline-none mb-3">
            <div class="flex gap-2">
                <button onclick="closeAdjModal()" class="flex-1 py-2.5 rounded-xl bg-zinc-700 hover:bg-zinc-600 text-white text-sm font-bold">ยกเลิก</button>
                <button id="adj-modal-submit" onclick="submitAdjModal()" class="flex-1 py-2.5 rounded-xl bg-blue-500 hover:bg-blue-400 text-white text-sm font-bold disabled:opacity-50">บันทึก</button>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        try { tg?.ready(); tg?.expand(); } catch(e) {}

        const _esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        const _fmt = (n) => Number(n).toLocaleString('th-TH', { minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 });
        const _date = (s) => s ? new Date(s).toLocaleDateString('th-TH', { day:'numeric', month:'short', year:'2-digit' }) : '—';
        const _dt = (s) => s ? new Date(s).toLocaleString('th-TH', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' }) : '—';

        let _currentTab = 'PENDING';
        let _currentShipmentId = null;
        let _currentAdjCustId = null;
        let _searchDebounce = null;
        let _currentOrdTab = 'NEEDS_VERIFY';
        let _ordSearchDebounce = null;

        // ---------- View routing ----------
        function showView(name) {
            document.querySelectorAll('[id^="view-"]').forEach(el => el.classList.add('hidden'));
            document.getElementById('view-' + name).classList.remove('hidden');
            document.getElementById('back-btn').classList.toggle('hidden', name === 'home');
            // load data
            if (name === 'shipments') loadShipments();
            else if (name === 'customers') { document.getElementById('cust-list').innerHTML = ''; }
            else if (name === 'coupons') loadCoupons();
            else if (name === 'mystery-boxes') loadMysteryBoxes();
            else if (name === 'dashboard') loadDashboard();
            else if (name === 'orders') loadOrders();
        }
        function goHome() { showView('home'); loadShipmentsBadge(); loadOrdersBadge(); }

        // ---------- INIT ----------
        async function init() {
            try {
                if (!tg?.initData) {
                    document.getElementById('loading-text').innerHTML = '<span class="text-red-400">กรุณาเปิดผ่าน Telegram</span>';
                    return;
                }
                const meRes = await fetch('/api/admin/me', { headers: { 'X-Init-Data': tg.initData } });
                if (meRes.status === 403 || meRes.status === 401) {
                    document.getElementById('loading-screen').classList.add('hidden');
                    document.getElementById('forbidden').classList.remove('hidden');
                    return;
                }
                const me = await meRes.json();
                if (!me.success) throw new Error(me.error || 'auth failed');
                document.getElementById('admin-name').textContent = me.name || me.telegramId;
                const roleEl = document.getElementById('admin-role');
                roleEl.textContent = me.role;
                roleEl.classList.add(`role-${me.role}`);
                window._adminRole = me.role;
                if (me.role === 'Owner') document.getElementById('menu-dashboard').classList.remove('hidden');
                document.getElementById('loading-screen').classList.add('hidden');
                document.getElementById('app').classList.remove('hidden');

                // shipments tabs
                document.querySelectorAll('.ship-tab').forEach(btn => {
                    btn.addEventListener('click', () => { _currentTab = btn.dataset.status; loadShipments(); });
                });
                // order tabs + search
                document.querySelectorAll('.ord-tab').forEach(btn => {
                    btn.addEventListener('click', () => { _currentOrdTab = btn.dataset.status; updateOrdTabUI(); loadOrders(); });
                });
                document.getElementById('ord-search').addEventListener('input', (e) => {
                    clearTimeout(_ordSearchDebounce);
                    _ordSearchDebounce = setTimeout(() => loadOrders(), 350);
                });
                // customer search debounce
                document.getElementById('cust-search').addEventListener('input', (e) => {
                    clearTimeout(_searchDebounce);
                    _searchDebounce = setTimeout(() => searchCustomers(e.target.value), 350);
                });

                showView('home');
                loadShipmentsBadge();
                loadOrdersBadge();
            } catch (e) {
                console.error('init error:', e);
                document.getElementById('loading-text').innerHTML = `<span class="text-red-400">${_esc(e.message)}</span>`;
            }
        }

        // ---------- 📦 Shipments ----------
        async function loadShipmentsBadge() {
            try {
                const res = await fetch('/api/admin/prize-shipments?status=PENDING', { headers: { 'X-Init-Data': tg.initData } });
                const data = await res.json();
                if (data.success) {
                    const n = data.shipments?.length || 0;
                    const b = document.getElementById('badge-shipments');
                    if (n > 0) { b.textContent = n; b.classList.remove('hidden'); }

            const [cls, label] = map[o.status] || ['bg-white/5 text-white', o.status];
            return `<span class="text-[9px] px-1.5 py-0.5 rounded ${cls}">${label}</span>`;
        }

        // ---------- 🎫 Coupons ----------
        async function loadCoupons() {
            const list = document.getElementById('cpn-list');
            list.innerHTML = '<div class="text-center text-zinc-500 py-6 animate-pulse">กำลังโหลด...</div>';
            try {
                const res = await fetch('/api/admin/coupons', { headers: { 'X-Init-Data': tg.initData } });
                const data = await res.json();
                if (!data.success) throw new Error(data.error || 'load failed');
                if (!data.coupons.length) { list.innerHTML = '<div class="text-center text-zinc-500 py-6 text-sm">ยังไม่มีคูปอง</div>'; return; }
                window._cpnCache = data.coupons;
                list.innerHTML = data.coupons.map((c, idx) => {
                    const valDisplay = c.type === 'GIFT' ? `รับฟรี${c.giftQty > 1 ? ' x'+c.giftQty : ''}` :
                        c.type === 'DISCOUNT_PERCENT' ? `ลด ${c.value}%` :
                        c.type === 'DISCOUNT_FLAT' ? `ลด ฿${c.value}` : '—';
                    const tags = [];
                    if (c.pointsCost) tags.push(`<span class="text-[9px] px-1.5 py-0.5 rounded bg-purple-500/20 text-purple-300">${c.pointsCost} แต้ม</span>`);
                    if (c.isAutoAssign) tags.push('<span class="text-[9px] px-1.5 py-0.5 rounded bg-blue-500/20 text-blue-300">Auto</span>');
                    if (c.rewardTrigger) tags.push(`<span class="text-[9px] px-1.5 py-0.5 rounded bg-orange-500/20 text-orange-300">${_esc(c.rewardTrigger)}</span>`);
                    return `
                    <div class="bg-white/5 border border-white/10 rounded-xl p-3 item-fade-in cursor-pointer hover:bg-white/10" style="animation-delay:${idx*30}ms" onclick="openCpnEdit('${_esc(c.id)}')">
                        <div class="flex items-start justify-between gap-2">
                            <div class="flex-1 min-w-0">
                                <div class="text-sm font-bold text-white truncate">${_esc(c.name)}</div>
                                <div class="text-[11px] text-zinc-400"><code>${_esc(c.id)}</code> · ${valDisplay}</div>
                                <div class="flex flex-wrap gap-1 mt-1">${tags.join('')}</div>
                                <div class="text-[10px] text-zinc-500 mt-1">
                                    ใช้แล้ว ${c.claimedCount}${c.totalQuota ? '/' + c.totalQuota : ''}
                                    ${c.endDate ? ' · ปิดรับ ' + _date(c.endDate) : ''}
                                </div>
                            </div>
                            <label class="switch flex-shrink-0" onclick="event.stopPropagation()">
                                <input type="checkbox" ${c.isActive ? 'checked' : ''} onchange="toggleCoupon('${_esc(c.id)}', this)">
                                <span class="slider"></span>
                            </label>
                        </div>
                    </div>`;
                }).join('');
            } catch (e) { list.innerHTML = '<div class="text-center text-red-400 py-6">โหลดไม่สำเร็จ</div>'; }
        }
        async function toggleCoupon(id, checkbox) {
            checkbox.disabled = true;
            try {
                const res = await fetch(`/api/admin/coupons/${encodeURIComponent(id)}/toggle`, {
                    method: 'PATCH', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ initData: tg.initData }),
                });
                const data = await res.json();
                if (!data.success) { alert(data.error || 'ไม่สำเร็จ'); checkbox.checked = !checkbox.checked; }
                else { try { tg.hapticFeedback?.impactOccurred?.('light'); } catch(e){} }
            } catch (e) { alert('error: '+e.message); checkbox.checked = !checkbox.checked; }
            finally { checkbox.disabled = false; }
        }

        function onCpnTypeChange() {
            const t = document.getElementById('cp-type')?.value;
            const giftRow = document.getElementById('cp-gift-row');
            const valueLabel = document.getElementById('cp-value-label');
            const valueRow = document.getElementById('cp-value-row');
            if (!t || !giftRow || !valueLabel) return;
            if (t === 'GIFT') { giftRow.classList.remove('hidden'); valueRow.classList.add('hidden'); }
            else { giftRow.classList.add('hidden'); valueRow.classList.remove('hidden'); valueLabel.textContent = (t === 'DISCOUNT_PERCENT') ? 'ส่วนลด %' : 'ส่วนลด ฿'; }
        }

        function closeCpnModal() {
            _editingCpnId = null;
            document.body.classList.remove('no-scroll');
            document.getElementById('cpn-modal').classList.add('hidden');
        }

        async function saveCpn() {
            const btn = document.getElementById('cp-save-btn');
            btn.disabled = true; const wasText = btn.textContent; btn.textContent = 'กำลังบันทึก...';
            const isNew = !_editingCpnId;
            const v = (id) => document.getElementById(id)?.value;
            const ck = (id) => document.getElementById(id)?.checked;
            const body = {
                name: v('cp-name'), nameEn: v('cp-nameEn'), description: v('cp-description'),
                type: v('cp-type'), value: v('cp-value'),
                giftCategoryId: v('cp-giftCategoryId'), giftQty: v('cp-giftQty'),
                minPurchase: v('cp-minPurchase'), minQty: v('cp-minQty'),
                targetCategoryId: v('cp-targetCategoryId'), targetProductId: v('cp-targetProductId'),
                totalQuota: v('cp-totalQuota'), usageLimitPerUser: v('cp-usageLimitPerUser'),
                startDate: v('cp-startDate') || null, endDate: v('cp-endDate') || null,
                validFrom: v('cp-validFrom') || null, validUntil: v('cp-validUntil') || null,
                validityDays: v('cp-validityDays'),
                pointsCost: v('cp-pointsCost'),
                isAutoAssign: ck('cp-isAutoAssign'), autoAssignQty: v('cp-autoAssignQty'),
                autoAssignTrigger: v('cp-autoAssignTrigger'),
                rewardTrigger: v('cp-rewardTrigger') || null, rewardRecipient: v('cp-rewardRecipient') || null,
                rewardMinAmount: v('cp-rewardMinAmount'), rewardMaxAmount: v('cp-rewardMaxAmount'),
                rewardOncePerReferral: ck('cp-rewardOncePerReferral'),
                isActive: ck('cp-isActive'),
                initData: tg.initData,
            };
            if (isNew) body.id = v('cp-id');
            try {
                const url = isNew ? '/api/admin/coupons' : `/api/admin/coupons/${encodeURIComponent(_editingCpnId)}`;
                const method = isNew ? 'POST' : 'PATCH';
                const res = await fetch(url, { method, headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
                const data = await res.json();
                if (!data.success) { alert(data.error || 'ไม่สำเร็จ'); btn.disabled = false; btn.textContent = wasText; return; }
                try { tg.hapticFeedback?.notificationOccurred?.('success'); } catch(e){}
                closeCpnModal();
                await loadCoupons();
            } catch (e) { alert('error: '+e.message); btn.disabled=false; btn.textContent=wasText; }
        }

        async function deleteCpn() {
            if (!_editingCpnId) return;
            if (!confirm('ลบคูปองนี้?\n(ถ้าเคยมีลูกค้าเก็บ จะ deactivate แทน)')) return;
            try {
                const res = await fetch(`/api/admin/coupons/${encodeURIComponent(_editingCpnId)}`, {
                    method: 'DELETE', headers: {'Content-Type':'application/json', 'X-Init-Data': tg.initData},
                    body: JSON.stringify({ initData: tg.initData }),
                });
                const data = await res.json();
                if (!data.success) { alert(data.error || 'ไม่สำเร็จ'); return; }
                if (data.softDeleted) alert('Soft-deleted (มีลูกค้าเก็บแล้ว ' + data.claimed + ' ราย)');
                closeCpnModal();
                await loadCoupons();
            } catch (e) { alert('error: '+e.message); }
        }

        // ---------- 🎁 Mystery Boxes ----------
        async function loadMysteryBoxes() {
            const list = document.getElementById('mbox-list');
            list.innerHTML = '<div class="text-center text-zinc-500 py-6 animate-pulse">กำลังโหลด...</div>';
            try {
                const res = await fetch('/api/admin/mystery-boxes', { headers: { 'X-Init-Data': tg.initData } });
                const data = await res.json();
                if (!data.success) throw new Error(data.error || 'load failed');
                if (!data.boxes.length) { list.innerHTML = '<div class="text-center text-zinc-500 py-6 text-sm">ยังไม่มี Mystery Box</div>'; return; }
                window._mboxCache = data.boxes;
                list.innerHTML = data.boxes.map((b, idx) => {
                    const tierTag = b.requiredTier && b.requiredTier !== 'NONE' ? `<span class="text-[9px] px-1.5 py-0.5 rounded bg-yellow-500/20 text-yellow-300">${b.requiredTier} only</span>` : '';
                    const conditionTag = b.minPurchaseAmount || b.maxPurchaseAmount
                        ? `<span class="text-[9px] px-1.5 py-0.5 rounded bg-blue-500/20 text-blue-300">฿${b.minPurchaseAmount||0}–${b.maxPurchaseAmount||'∞'}</span>` : '';
                    const prizesHtml = b.prizes.slice(0, 4).map(p => `
                        <div class="flex items-center gap-1.5 text-[11px]">
                            ${p.imageUrl ? `<img src="${_esc(p.imageUrl)}" class="w-5 h-5 rounded object-cover">` : '<div class="w-5 h-5 rounded bg-zinc-700 flex items-center justify-center text-[9px]">🎁</div>'}
                            <span class="text-zinc-300 truncate flex-1">${_esc(p.name)}</span>
                            <span class="text-zinc-500">w${p.weight}</span>
                        </div>`).join('');
                    return `
                    <div class="bg-white/5 border border-white/10 rounded-xl p-3 item-fade-in" style="animation-delay:${idx*30}ms">
                        <div class="flex items-start justify-between gap-2 mb-2">
                            <div class="flex-1 min-w-0 cursor-pointer" onclick="openMboxEdit('${_esc(b.id)}')">
                                <div class="text-sm font-bold text-white truncate">${_esc(b.name)} <i class="ri-edit-line text-[11px] text-zinc-500"></i></div>
                                <div class="text-[11px] text-zinc-400"><code>${_esc(b.id)}</code> · ${_esc(b.trigger)}</div>
                                <div class="flex flex-wrap gap-1 mt-1">${tierTag}${conditionTag}</div>
                                <div class="text-[10px] text-zinc-500 mt-1">
                                    แจกแล้ว ${b.ticketCount} ใบ · ${b.prizes.length} รางวัล
                                    ${b.endDate ? ' · จบ ' + _date(b.endDate) : ''}
                                </div>
                            </div>
                            <label class="switch flex-shrink-0">
                                <input type="checkbox" ${b.isActive ? 'checked' : ''} onchange="toggleMbox('${_esc(b.id)}', this)">
                                <span class="slider"></span>
                            </label>
                        </div>
                        ${prizesHtml ? `<div class="bg-black/20 rounded-lg p-2 space-y-1 mt-1">${prizesHtml}${b.prizes.length > 4 ? `<div class="text-[10px] text-zinc-500 text-center">+ อีก ${b.prizes.length - 4} รางวัล</div>` : ''}</div>` : ''}
                    </div>`;
                }).join('');
            } catch (e) { list.innerHTML = '<div class="text-center text-red-400 py-6">โหลดไม่สำเร็จ</div>'; }
        }
        // ----- Mystery Box edit modal -----
        let _editingMboxId = null;
        let _editingMboxData = null;

        async function openMboxEdit(id) {
            _editingMboxId = id || null; // null = create new
            _editingMboxData = id ? (window._mboxCache || []).find(b => b.id === id) : null;
            const isNew = !id;
            const b = _editingMboxData || {};

            const html = `
                <div class="flex items-start justify-between mb-3">
                    <h3 class="text-base font-bold">${isNew ? '➕ สร้าง Mystery Box ใหม่' : '✏️ แก้ไข ' + _esc(b.name || '')}</h3>
                    <button onclick="closeMboxModal()" class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center"><i class="ri-close-line"></i></button>
                </div>
                <div class="space-y-3 text-sm">
                    ${isNew ? `
                    <div>
                        <label class="text-[11px] text-zinc-400 block mb-1">รหัสกล่อง (เช่น MB_FRIEND, ห้ามซ้ำ) *</label>
                        <input id="mb-id" type="text" placeholder="MB_XXX" class="w-full bg-black/40 border border-white/10 rounded-lg p-2 text-white">
                    </div>` : ''}
                    <div>
                        <label class="text-[11px] text-zinc-400 block mb-1">ชื่อกล่อง *</label>
                        <input id="mb-name" type="text" value="${_esc(b.name||'')}" class="w-full bg-black/40 border border-white/10 rounded-lg p-2 text-white">
                    </div>
                    <div>
                        <label class="text-[11px] text-zinc-400 block mb-1">ชื่ออังกฤษ (optional)</label>
                        <input id="mb-nameEn" type="text" value="${_esc(b.nameEn||'')}" class="w-full bg-black/40 border border-white/10 rounded-lg p-2 text-white">
                    </div>
                    <div>
                        <label class="text-[11px] text-zinc-400 block mb-1">รายละเอียด</label>
                        <textarea id="mb-description" rows="2" class="w-full bg-black/40 border border-white/10 rounded-lg p-2 text-white">${_esc(b.description||'')}</textarea>
                    </div>
                    <div>
                        <label class="text-[11px] text-zinc-400 block mb-1">URL รูปกล่อง</label>
                        <input id="mb-imageUrl" type="text" value="${_esc(b.imageUrl||'')}" placeholder="https://..." class="w-full bg-black/40 border border-white/10 rounded-lg p-2 text-white">
                    </div>
                    <div>
                        <label class="text-[11px] text-zinc-400 block mb-1">Trigger *</label>
                        <select id="mb-trigger" class="w-full bg-black/40 border border-white/10 rounded-lg p-2 text-white">
                            ${['REFEREE_FIRST_PURCHASE','PURCHASE_MILESTONE','REVIEW_PRODUCT','JOIN_CHANNEL','ADMIN_GRANT'].map(t =>
                                `<option value="${t}" ${b.trigger===t?'selected':''}>${t}</option>`
                            ).join('')}
                        </select>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="text-[11px] text-zinc-400 block mb-1">ยอดขั้นต่ำ (ถ้ามี)</label>
                            <input id="mb-minPurchaseAmount" type="number" value="${b.minPurchaseAmount||''}" class="w-full bg-black/40 border border-white/10 rounded-lg p-2 text-white">
                        </div>
                        <div>
                            <label class="text-[11px] text-zinc-400 block mb-1">ยอดเพดาน (ถ้ามี)</label>
                            <input id="mb-maxPurchaseAmount" type="number" value="${b.maxPurchaseAmount||''}" class="w-full bg-black/40 border border-white/10 rounded-lg p-2 text-white">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="text-[11px] text-zinc-400 block mb-1">สิทธิ์ต่อ event</label>
                            <input id="mb-ticketsPerEvent" type="number" value="${b.ticketsPerEvent||1}" class="w-full bg-black/40 border border-white/10 rounded-lg p-2 text-white">
                        </div>
                        <div>
                            <label class="text-[11px] text-zinc-400 block mb-1">เพดานต่อคน (ตลอดอายุกล่อง)</label>
                            <input id="mb-maxPerUser" type="number" value="${b.maxPerUser||''}" placeholder="ไม่จำกัด" class="w-full bg-black/40 border border-white/10 rounded-lg p-2 text-white">
                        </div>
                    </div>
                    <div>
                        <label class="text-[11px] text-zinc-400 block mb-1">เงื่อนไข tier</label>
                        <select id="mb-requiredTier" class="w-full bg-black/40 border border-white/10 rounded-lg p-2 text-white">
                            ${['NONE','SILVER','GOLD'].map(t => `<option value="${t}" ${(b.requiredTier||'NONE')===t?'selected':''}>${t}</option>`).join('')}
                        </select>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="text-[11px] text-zinc-400 block mb-1">เริ่ม (optional)</label>
                            <input id="mb-startDate" type="datetime-local" value="${b.startDate ? new Date(b.startDate).toISOString().slice(0,16) : ''}" class="w-full bg-black/40 border border-white/10 rounded-lg p-2 text-white">
                        </div>
                        <div>
                            <label class="text-[11px] text-zinc-400 block mb-1">จบ (optional)</label>
                            <input id="mb-endDate" type="datetime-local" value="${b.endDate ? new Date(b.endDate).toISOString().slice(0,16) : ''}" class="w-full bg-black/40 border border-white/10 rounded-lg p-2 text-white">
                        </div>
                    </div>
                    <label class="flex items-center gap-2"><input id="mb-isActive" type="checkbox" ${(b.isActive!==false)?'checked':''} class="w-4 h-4 accent-purple-500"> Active</label>
                </div>

                ${!isNew ? `
                <div class="mt-4 pt-3 border-t border-white/10">
                    <div class="flex items-center justify-between mb-2">
                        <div class="text-sm font-bold">🎁 รางวัลในกล่อง (${b.prizes?.length || 0})</div>
                        <button onclick="openPrizeEdit('${_esc(id)}', null)" class="text-xs px-2.5 py-1 rounded-full bg-white/10 hover:bg-white/20 text-white">+ เพิ่มรางวัล</button>
                    </div>
                    <div id="mb-prizes-inline" class="space-y-1.5">
                        ${(b.prizes||[]).map(p => `
                            <div class="flex items-center gap-2 text-xs bg-white/5 border border-white/10 rounded-lg p-2">
                                ${p.imageUrl ? `<img src="${_esc(p.imageUrl)}" class="w-7 h-7 rounded object-cover">` : '<div class="w-7 h-7 rounded bg-zinc-700 flex items-center justify-center text-sm">🎁</div>'}
                                <div class="flex-1 min-w-0">
                                    <div class="truncate text-white">${_esc(p.name)}</div>
                                    <div class="text-[10px] text-zinc-500">w${p.weight}${p.isPhysicalReward?' · physical':''}${p.rewardCouponId?' · coupon: '+_esc(p.rewardCouponId):''}</div>
                                </div>
                                <button onclick="openPrizeEdit('${_esc(id)}', ${p.id})" class="text-zinc-400 hover:text-white text-base"><i class="ri-edit-line"></i></button>
                                <button onclick="deletePrize('${_esc(id)}', ${p.id})" class="text-zinc-500 hover:text-red-400 text-base"><i class="ri-delete-bin-line"></i></button>
                            </div>`).join('') || '<div class="text-zinc-500 text-xs py-2 text-center">ยังไม่มีรางวัล</div>'}
                    </div>
                </div>` : ''}

                <div class="mt-4 flex gap-2">
                    <button onclick="closeMboxModal()" class="flex-1 py-2.5 rounded-xl bg-zinc-700 text-white font-bold">ยกเลิก</button>
                    <button id="mb-save-btn" onclick="saveMbox()" class="flex-1 py-2.5 rounded-xl bg-purple-500 hover:bg-purple-400 text-white font-bold disabled:opacity-50">${isNew ? 'สร้าง' : 'บันทึก'}</button>
                </div>`;

            document.getElementById('mbox-modal-content').innerHTML = html;
            document.body.classList.add('no-scroll');
            document.getElementById('mbox-modal').classList.remove('hidden');
        }

        function closeMboxModal() {
            _editingMboxId = null; _editingMboxData = null;
            document.body.classList.remove('no-scroll');
            document.getElementById('mbox-modal').classList.add('hidden');
        }

        async function saveMbox() {
            const btn = document.getElementById('mb-save-btn');
            btn.disabled = true; const wasText = btn.textContent; btn.textContent = 'กำลังบันทึก...';
            const isNew = !_editingMboxId;
            const body = {
                name: document.getElementById('mb-name').value,
                nameEn: document.getElementById('mb-nameEn').value,
                description: document.getElementById('mb-description').value,
                imageUrl: document.getElementById('mb-imageUrl').value,
                trigger: document.getElementById('mb-trigger').value,
                minPurchaseAmount: document.getElementById('mb-minPurchaseAmount').value,
                maxPurchaseAmount: document.getElementById('mb-maxPurchaseAmount').value,
                ticketsPerEvent: document.getElementById('mb-ticketsPerEvent').value,
                maxPerUser: document.getElementById('mb-maxPerUser').value,
                requiredTier: document.getElementById('mb-requiredTier').value,
                startDate: document.getElementById('mb-startDate').value || null,
                endDate: document.getElementById('mb-endDate').value || null,
                isActive: document.getElementById('mb-isActive').checked,
                initData: tg.initData,
            };
            if (isNew) body.id = document.getElementById('mb-id').value;
            try {
                const url = isNew ? '/api/admin/mystery-boxes' : `/api/admin/mystery-boxes/${encodeURIComponent(_editingMboxId)}`;
                const method = isNew ? 'POST' : 'PATCH';
                const res = await fetch(url, { method, headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
                const data = await res.json();
                if (!data.success) { alert(data.error || 'ไม่สำเร็จ'); btn.disabled = false; btn.textContent = wasText; return; }
                try { tg.hapticFeedback?.notificationOccurred?.('success'); } catch(e){}
                closeMboxModal();
                await loadMysteryBoxes();
            } catch (e) { alert('error: '+e.message); btn.disabled=false; btn.textContent=wasText; }
        }

        // ----- Prize edit modal -----
        let _editingPrizeBoxId = null;
        let _editingPrizeId = null;
        let _couponOptions = [];

        async function openPrizeEdit(boxId, prizeId) {
            _editingPrizeBoxId = boxId;
            _editingPrizeId = prizeId; // null = create
            const box = (window._mboxCache || []).find(b => b.id === boxId);
            const prize = prizeId ? (box?.prizes || []).find(p => p.id === prizeId) : null;
            const isNew = !prizeId;

            // load coupon options ถ้ายังไม่มี
            if (_couponOptions.length === 0) {
                try {
                    const r = await fetch('/api/admin/coupon-options', { headers: { 'X-Init-Data': tg.initData } });
                    const d = await r.json();
                    if (d.success) _couponOptions = d.coupons || [];
                } catch (e) {}
            }
            const couponOpts = ['<option value="">— ไม่ผูกคูปอง —</option>',
                ..._couponOptions.map(c => `<option value="${_esc(c.id)}" ${prize?.rewardCouponId===c.id?'selected':''}>${_esc(c.name)} (${_esc(c.id)})</option>`)
            ].join('');

            const html = `
                <div class="flex items-start justify-between mb-3">
                    <h3 class="text-base font-bold">${isNew ? '➕ เพิ่มรางวัล' : '✏️ แก้ไขรางวัล'}</h3>
                    <button onclick="closePrizeModal()" class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center"><i class="ri-close-line"></i></button>
                </div>
                <div class="space-y-3 text-sm">
                    <div>
                        <label class="text-[11px] text-zinc-400 block mb-1">ชื่อรางวัล *</label>
                        <input id="pz-name" type="text" value="${_esc(prize?.name||'')}" class="w-full bg-black/40 border border-white/10 rounded-lg p-2 text-white">
                    </div>
                    <div>
                        <label class="text-[11px] text-zinc-400 block mb-1">URL รูป</label>
                        <input id="pz-imageUrl" type="text" value="${_esc(prize?.imageUrl||'')}" placeholder="https://..." class="w-full bg-black/40 border border-white/10 rounded-lg p-2 text-white">
                    </div>
                    <div>
                        <label class="text-[11px] text-zinc-400 block mb-1">น้ำหนัก (สูง = มีโอกาสออกมาก)</label>
                        <input id="pz-weight" type="number" value="${prize?.weight||1}" min="1" class="w-full bg-black/40 border border-white/10 rounded-lg p-2 text-white">
                    </div>
                    <div>
                        <label class="text-[11px] text-zinc-400 block mb-1">คูปองที่ผูก (optional)</label>
                        <select id="pz-rewardCouponId" class="w-full bg-black/40 border border-white/10 rounded-lg p-2 text-white">${couponOpts}</select>
                        <p class="text-[10px] text-zinc-500 mt-1">เลือกคูปอง = หลังเปิดกล่อง ลูกค้าได้คูปองในกระเป๋า</p>
                    </div>
                    <label class="flex items-center gap-2"><input id="pz-isPhysical" type="checkbox" ${prize?.isPhysicalReward?'checked':''} class="w-4 h-4 accent-purple-500"> เป็นของจริง (admin ต้องส่งไปรษณีย์)</label>
                </div>
                <div class="mt-4 flex gap-2">
                    <button onclick="closePrizeModal()" class="flex-1 py-2.5 rounded-xl bg-zinc-700 text-white font-bold">ยกเลิก</button>
                    <button id="pz-save-btn" onclick="savePrize()" class="flex-1 py-2.5 rounded-xl bg-purple-500 hover:bg-purple-400 text-white font-bold">${isNew?'เพิ่ม':'บันทึก'}</button>
                </div>`;

            document.getElementById('prize-modal-content').innerHTML = html;
            document.body.classList.add('no-scroll');
            document.getElementById('prize-modal').classList.remove('hidden');
        }

        function closePrizeModal() {
            _editingPrizeBoxId = null; _editingPrizeId = null;
            document.body.classList.remove('no-scroll');
            document.getElementById('prize-modal').classList.add('hidden');
        }

        async function savePrize() {
            const btn = document.getElementById('pz-save-btn');
            btn.disabled = true; const wasText = btn.textContent; btn.textContent = 'กำลังบันทึก...';
            const body = {
                name: document.getElementById('pz-name').value,
                imageUrl: document.getElementById('pz-imageUrl').value,
                weight: document.getElementById('pz-weight').value,
                rewardCouponId: document.getElementById('pz-rewardCouponId').value,
                isPhysicalReward: document.getElementById('pz-isPhysical').checked,
                initData: tg.initData,
            };
            try {
                const url = _editingPrizeId
                    ? `/api/admin/mystery-boxes/${encodeURIComponent(_editingPrizeBoxId)}/prizes/${_editingPrizeId}`
                    : `/api/admin/mystery-boxes/${encodeURIComponent(_editingPrizeBoxId)}/prizes`;
                const method = _editingPrizeId ? 'PATCH' : 'POST';
                const res = await fetch(url, { method, headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
                const data = await res.json();
                if (!data.success) { alert(data.error || 'ไม่สำเร็จ'); btn.disabled=false; btn.textContent=wasText; return; }
                try { tg.hapticFeedback?.notificationOccurred?.('success'); } catch(e){}
                const boxId = _editingPrizeBoxId;
                closePrizeModal();
                await loadMysteryBoxes();
                openMboxEdit(boxId); // re-open box edit to show updated prizes
            } catch (e) { alert('error: '+e.message); btn.disabled=false; btn.textContent=wasText; }
        }

        async function deletePrize(boxId, prizeId) {
            if (!confirm('ลบรางวัลนี้?\n(ถ้าเคยมีลูกค้าได้รับ จะ soft-delete แทน)')) return;
            try {
                const res = await fetch(`/api/admin/mystery-boxes/${encodeURIComponent(boxId)}/prizes/${prizeId}`, {
                    method: 'DELETE',
                    headers: {'Content-Type':'application/json', 'X-Init-Data': tg.initData},
                    body: JSON.stringify({ initData: tg.initData }),
                });
                const data = await res.json();
                if (!data.success) { alert(data.error||'ไม่สำเร็จ'); return; }
                if (data.softDeleted) alert('Soft-deleted (มีลูกค้าใช้แล้ว ' + data.usedCount + ' ราย)');
                await loadMysteryBoxes();
                openMboxEdit(boxId);
            } catch (e) { alert('error: '+e.message); }
        }

        async function toggleMbox(id, checkbox) {
            checkbox.disabled = true;
            try {
                const res = await fetch(`/api/admin/mystery-boxes/${encodeURIComponent(id)}/toggle`, {
                    method: 'PATCH', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ initData: tg.initData }),
                });
                const data = await res.json();
                if (!data.success) { alert(data.error || 'ไม่สำเร็จ'); checkbox.checked = !checkbox.checked; }
                else { try { tg.hapticFeedback?.impactOccurred?.('light'); } catch(e){} }
            } catch (e) { alert('error: '+e.message); checkbox.checked = !checkbox.checked; }
            finally { checkbox.disabled = false; }
        }

        init();
    </script>
</body>
</html>
