<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#121212">
    <title>ONEHUB · กล่องสุ่ม</title>
    <link rel="icon" type="image/png" href="logo.png">

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/auth-cache.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <script src="i18n.js?v=4"></script>

    <style>
        :root { --bg-color: #121212; --secondary-bg: #1E1E1E; }
        html, body { overscroll-behavior-y: none; }
        body { background: var(--bg-color); color: white; font-family: 'Kanit', sans-serif; -webkit-tap-highlight-color: transparent; }
        .glass-card { background: var(--secondary-bg); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        .no-scroll { overflow: hidden; }

        /* Mystery animations */
        @keyframes mystery-pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(168,85,247,0.5); }
            50% { box-shadow: 0 0 0 10px rgba(168,85,247,0); }
        }
        .mystery-card { animation: mystery-pulse 2.5s ease-in-out infinite; }

        @keyframes shake {
            0%, 100% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(-15deg) scale(1.1); }
            50% { transform: rotate(0deg) scale(1.15); }
            75% { transform: rotate(15deg) scale(1.1); }
        }
        .shake { animation: shake 0.6s ease-in-out infinite; display: inline-block; }

        @keyframes bounce-in {
            0% { transform: scale(0); opacity: 0; }
            70% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); }
        }
        .bounce-in { animation: bounce-in 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55); }

        @keyframes confetti-fall {
            0% { transform: translateY(-30px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
        }
        .confetti-piece {
            position: fixed;
            top: 0;
            font-size: 22px;
            pointer-events: none;
            z-index: 100;
            animation: confetti-fall 3s linear forwards;
            will-change: transform, opacity;
        }

        .item-fade-in { opacity: 0; animation: fadeUp 0.4s ease-out forwards; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="p-5">
    <div id="loading-screen" class="fixed inset-0 z-30 bg-[#121212] flex items-center justify-center">
        <div class="text-center">
            <div class="text-6xl mb-3">🎁</div>
            <p class="text-zinc-400">กำลังโหลด...</p>
        </div>
    </div>

    <div id="app-content" class="hidden w-full max-w-md mx-auto space-y-4 pb-32">
        <!-- Top bar -->
        <div class="flex items-center justify-between pb-2">
            <a href="dashboard.html" class="inline-flex items-center justify-center w-9 h-9 rounded-full bg-white/5 border border-white/20 active:scale-95 transition" aria-label="Back">
                <i class="ri-arrow-left-s-line text-xl"></i>
            </a>
            <h1 class="text-lg font-bold flex items-center gap-2"><span>🎁</span> <span>กล่องสุ่ม</span></h1>
            <div class="w-9 h-9"></div>
        </div>

        <!-- กล่องของฉัน (Unopened first, then history) -->
        <div class="glass-card p-5">
            <div class="flex items-center justify-between mb-3">
                <div class="text-sm font-bold text-yellow-200 flex items-center gap-2">
                    <i class="ri-treasure-map-fill text-yellow-400"></i> กล่องของฉัน
                </div>
                <span id="my-tickets-count" class="text-xs text-zinc-400">0 ใบ</span>
            </div>
            <div id="my-tickets-list" class="space-y-2.5">
                <div class="text-center text-gray-500 py-6 animate-pulse">กำลังโหลด...</div>
            </div>
        </div>

        <!-- Catalog: วิธีรับกล่อง + รายละเอียดของในกล่อง -->
        <div class="glass-card p-5">
            <div class="text-sm font-bold mb-1 flex items-center gap-2 text-purple-200">
                <i class="ri-gift-2-fill text-purple-400"></i> กล่องที่หาเก็บได้
            </div>
            <p class="text-[11px] text-zinc-400 mb-3">รับสิทธิ์เปิดกล่องตามเงื่อนไขที่กำหนด — ของรางวัลในกล่องเป็น random</p>
            <div id="catalog-list" class="space-y-3">
                <div class="text-center text-gray-500 py-4 animate-pulse">กำลังโหลด...</div>
            </div>
        </div>
    </div>

    <!-- Reveal Modal -->
    <div id="reveal-modal" class="hidden fixed inset-0 z-[80] flex items-center justify-center bg-black/95 backdrop-blur-md p-6"></div>

    <!-- Bottom nav (เหมือน dashboard) -->
    <div id="bottom-nav" class="fixed bottom-4 left-0 right-0 z-[70] mx-auto w-[calc(100%-2.5rem)] max-w-md bg-[#1E1E1E] shadow-xl rounded-full p-2 flex justify-around items-center">
        <a href="home.html" class="flex flex-col items-center text-xs font-medium text-gray-400 w-1/4 py-1.5">
            <i class="ri-home-4-line text-xl"></i><span>หน้าหลัก</span>
        </a>
        <a href="products.html" class="flex flex-col items-center text-xs font-medium text-gray-400 w-1/4 py-1.5">
            <i class="ri-shopping-cart-line text-xl"></i><span>เมนูสินค้า</span>
        </a>
        <a href="referral.html" class="flex flex-col items-center text-xs font-medium text-gray-400 w-1/4 py-1.5">
            <i class="ri-team-line text-xl"></i><span>แนะนำเพื่อน</span>
        </a>
        <a href="dashboard.html" class="flex flex-col items-center text-xs font-medium text-gray-400 w-1/4 py-1.5">
            <i class="ri-id-card-line text-xl"></i><span>บัตรสมาชิก</span>
        </a>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        try { tg?.ready(); tg?.expand(); } catch(e) {}

        const _esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        const _fmt = (n) => Number(n).toLocaleString('th-TH', { minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 });

        function _triggerLabel(t) {
            const map = {
                'REFEREE_FIRST_PURCHASE': '👥 เพื่อนซื้อครั้งแรกผ่านลิงก์ของคุณ',
                'JOIN_CHANNEL': '📣 เข้าร่วม Telegram channel',
                'ADMIN_GRANT': '🎁 รับจากแอดมิน',
                'PURCHASE_MILESTONE': '🛒 ครบยอดสั่งซื้อสะสม',
                'REVIEW_PRODUCT': '⭐ รีวิวสินค้าครั้งแรก',
            };
            return map[t] || t;
        }

        async function init() {
            try {
                // Fast-boot จาก cache
                const _cached = window.AuthCache?.get();
                if (_cached && _cached.customerId) {
                    window.currentUser = _cached;
                    document.getElementById('loading-screen').classList.add('hidden');
                    document.getElementById('app-content').classList.remove('hidden');
                    Promise.all([loadMyTickets(), loadCatalog()]);
                    // bg refresh
                    setTimeout(() => fetchAuthBg(), 250);
                    return;
                }

                if (!tg?.initData) {
                    document.getElementById('loading-screen').innerHTML = '<p class="text-red-400">กรุณาเปิดผ่าน Telegram</p>';
                    return;
                }
                const authRes = await fetch('/api/auth', {
                    method: 'POST', headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({ initData: tg.initData })
                });
                const auth = await authRes.json();
                if (!auth.isMember) {
                    setTimeout(() => window.location.href='dashboard.html', 1000);
                    return;
                }
                window.currentUser = auth.customer;
                try { window.AuthCache?.set(auth.customer); } catch(e){}

                document.getElementById('loading-screen').classList.add('hidden');
                document.getElementById('app-content').classList.remove('hidden');

                await Promise.all([loadMyTickets(), loadCatalog()]);
            } catch (e) {
                console.error('init error:', e);
                document.getElementById('loading-screen').innerHTML = '<p class="text-red-400">เกิดข้อผิดพลาด</p>';
            }
        }

        async function fetchAuthBg() {
            try {
                if (!tg?.initData) return;
                const res = await fetch('/api/auth', {
                    method: 'POST', headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({ initData: tg.initData })
                });
                if (!res.ok) return;
                const data = await res.json();
                if (data.isMember && data.customer) {
                    window.currentUser = data.customer;
                    try { window.AuthCache?.set(data.customer); } catch(e){}
                }
            } catch (e) { /* silent */ }
        }

        async function loadMyTickets() {
            const list = document.getElementById('my-tickets-list');
            const countEl = document.getElementById('my-tickets-count');
            try {
                const tgId = window.currentUser?.telegramUserId || tg.initDataUnsafe?.user?.id;
                const res = await fetch(`/api/mystery-box/my/${tgId}`);
                const data = await res.json();
                if (!data.success) throw new Error(data.error || 'load failed');

                if (!data.tickets || data.tickets.length === 0) {
                    list.innerHTML = '<div class="text-center text-gray-500 py-6 text-sm">ยังไม่มีกล่องสุ่ม — รับได้จากเงื่อนไขด้านล่าง</div>';
                    countEl.textContent = '0 ใบ';
                    return;
                }
                countEl.textContent = `${data.tickets.length} ใบ (ยังไม่เปิด ${data.unopened})`;

                let html = '';
                data.tickets.forEach((t, i) => {
                    const isUnopened = t.status === 'UNOPENED';
                    if (isUnopened) {
                        const img = t.boxImageUrl
                            ? `<img src="${_esc(t.boxImageUrl)}" alt="" class="w-14 h-14 rounded-xl object-cover flex-shrink-0">`
                            : `<div class="w-14 h-14 rounded-xl bg-gradient-to-br from-purple-500/40 to-pink-500/40 flex items-center justify-center text-3xl flex-shrink-0">🎁</div>`;
                        html += `
                        <div class="mystery-card rounded-2xl p-3.5 item-fade-in" style="animation-delay:${i*60}ms; background: linear-gradient(135deg, rgba(168,85,247,0.18), rgba(236,72,153,0.18)); border: 1px solid rgba(168,85,247,0.4);">
                            <div class="flex items-center gap-3 mb-3">
                                ${img}
                                <div class="flex-1 min-w-0">
                                    <div class="text-sm font-bold text-white truncate">${_esc(t.boxName || 'กล่องสุ่ม')}</div>
                                    <div class="text-[11px] text-purple-200">เปิดเพื่อลุ้นรางวัลภายใน</div>
                                </div>
                            </div>
                            <button onclick="openTicket(${t.id})" class="w-full py-2.5 rounded-xl bg-gradient-to-r from-purple-500 to-pink-500 hover:opacity-90 font-bold text-white shadow-lg active:scale-95 transition flex items-center justify-center gap-2">
                                <i class="ri-magic-line"></i> เปิดกล่อง
                            </button>
                        </div>`;
                    } else {
                        // OPENED — แสดงประวัติย่อ
                        const prize = t.awardedPrize;
                        const prizeImg = prize?.imageUrl
                            ? `<img src="${_esc(prize.imageUrl)}" alt="" class="w-10 h-10 rounded-lg object-cover flex-shrink-0">`
                            : `<div class="w-10 h-10 rounded-lg bg-zinc-700 flex items-center justify-center text-lg flex-shrink-0">🎉</div>`;
                        html += `
                        <div class="rounded-xl p-3 bg-white/5 border border-white/10 item-fade-in opacity-70" style="animation-delay:${i*60}ms">
                            <div class="flex items-center gap-3">
                                ${prizeImg}
                                <div class="flex-1 min-w-0">
                                    <div class="text-[10px] text-zinc-500">${_esc(t.boxName || 'กล่อง')}</div>
                                    <div class="text-sm font-medium text-white truncate">ได้รับ: ${_esc(prize?.name || '—')}</div>
                                </div>
                                <i class="ri-check-double-line text-green-400 text-lg"></i>
                            </div>
                        </div>`;
                    }
                });
                list.innerHTML = html;
            } catch (e) {
                console.error(e);
                list.innerHTML = '<div class="text-center text-red-400 py-4">โหลดไม่สำเร็จ</div>';
            }
        }

        async function loadCatalog() {
            const list = document.getElementById('catalog-list');
            try {
                const tgId = window.currentUser?.telegramUserId || tg.initDataUnsafe?.user?.id;
                const res = await fetch(`/api/mystery-box/catalog?telegramId=${encodeURIComponent(tgId || '')}`);
                const data = await res.json();
                if (!data.success) throw new Error('load failed');

                if (!data.boxes || data.boxes.length === 0) {
                    list.innerHTML = '<div class="text-center text-gray-500 py-4 text-sm">ยังไม่มีกล่องสุ่ม active</div>';
                    return;
                }

                let html = '';
                data.boxes.forEach((box, idx) => {
                    let conditionText = _triggerLabel(box.trigger);
                    if (box.trigger === 'REFEREE_FIRST_PURCHASE') {
                        if (box.minPurchaseAmount && box.maxPurchaseAmount) {
                            conditionText += ` (ยอด ฿${_fmt(box.minPurchaseAmount)}–฿${_fmt(box.maxPurchaseAmount)})`;
                        } else if (box.minPurchaseAmount) {
                            conditionText += ` (ยอด ≥ ฿${_fmt(box.minPurchaseAmount)})`;
                        } else if (box.maxPurchaseAmount) {
                            conditionText += ` (ยอด ≤ ฿${_fmt(box.maxPurchaseAmount)})`;
                        }
                    }
                    const ticketsInfo = box.ticketsPerEvent > 1
                        ? `รับ ${box.ticketsPerEvent} สิทธิ์/ครั้ง`
                        : `รับ 1 สิทธิ์/ครั้ง`;
                    const maxInfo = box.maxPerUser ? ` · เพดาน ${box.maxPerUser} ครั้ง/คน` : '';
                    const tierInfo = (box.requiredTierMin && box.requiredTierMin > 0)
                        ? ` · เฉพาะผู้ชวนเพื่อนเดือนนี้ ≥ ${box.requiredTierMin} คน`
                        : '';

                    // User progress (claimed/maxPerUser)
                    let progressBadge = '';
                    if (typeof box.userClaimedCount === 'number' && box.userClaimedCount > 0) {
                        if (box.maxPerUser) {
                            const reached = box.userRemaining === 0;
                            const cls = reached ? 'bg-green-500/20 text-green-300 border-green-500/30' : 'bg-blue-500/20 text-blue-300 border-blue-500/30';
                            const txt = reached
                                ? `✓ รับครบแล้ว (${box.userClaimedCount}/${box.maxPerUser})`
                                : `คุณรับไปแล้ว ${box.userClaimedCount}/${box.maxPerUser}`;
                            progressBadge = `<div class="inline-flex items-center text-[10px] px-2 py-0.5 rounded-full border ${cls} mt-1">${_esc(txt)}</div>`;
                        } else {
                            progressBadge = `<div class="inline-flex items-center text-[10px] px-2 py-0.5 rounded-full bg-blue-500/20 text-blue-300 border border-blue-500/30 mt-1">คุณรับไปแล้ว ${box.userClaimedCount} ครั้ง</div>`;
                        }
                    }

                    const boxImg = box.imageUrl
                        ? `<img src="${_esc(box.imageUrl)}" alt="" class="w-16 h-16 rounded-xl object-cover flex-shrink-0">`
                        : `<div class="w-16 h-16 rounded-xl bg-gradient-to-br from-purple-500/30 to-pink-500/30 flex items-center justify-center text-3xl flex-shrink-0">🎁</div>`;

                    let prizesHtml = '';
                    if (box.prizes && box.prizes.length > 0) {
                        prizesHtml = `
                        <div class="mt-3 pt-3 border-t border-white/10">
                            <div class="text-[10px] text-zinc-400 mb-2 uppercase tracking-wider">รางวัลในกล่อง</div>
                            <div class="space-y-1.5">
                            ${box.prizes.map(p => {
                                const pImg = p.imageUrl
                                    ? `<img src="${_esc(p.imageUrl)}" alt="" class="w-8 h-8 rounded-md object-cover flex-shrink-0">`
                                    : `<div class="w-8 h-8 rounded-md bg-zinc-700 flex items-center justify-center text-sm flex-shrink-0">🎁</div>`;
                                return `
                                <div class="flex items-center gap-2 text-[12px]">
                                    ${pImg}
                                    <span class="flex-1 text-zinc-200 truncate">${_esc(p.name)}</span>
                                    <span class="text-yellow-300 font-bold whitespace-nowrap">${p.chancePercent}%</span>
                                </div>`;
                            }).join('')}
                            </div>
                        </div>`;
                    }

                    let actionBtn = '';
                    if (box.trigger === 'JOIN_CHANNEL') {
                        actionBtn = `
                        <button onclick="claimChannelBox('${_esc(box.id)}', this)" class="mt-3 w-full py-2 rounded-xl bg-purple-500/30 hover:bg-purple-500/50 text-white text-sm font-bold border border-purple-400/40 active:scale-95 transition">
                            <i class="ri-check-line"></i> ตรวจสอบและรับสิทธิ์
                        </button>`;
                    }

                    html += `
                    <div class="bg-white/5 rounded-2xl p-3.5 border border-white/10 item-fade-in" style="animation-delay:${idx*80}ms">
                        <div class="flex items-start gap-3">
                            ${boxImg}
                            <div class="flex-1 min-w-0">
                                <div class="text-sm font-bold text-white">${_esc(box.name)}</div>
                                ${box.description ? `<div class="text-[11px] text-zinc-400 mt-0.5">${_esc(box.description)}</div>` : ''}
                                <div class="text-[11px] text-purple-200 mt-1.5 flex items-start gap-1.5">
                                    <i class="ri-check-line mt-0.5 flex-shrink-0"></i><span>${_esc(conditionText)}</span>
                                </div>
                                <div class="text-[10px] text-zinc-500 mt-0.5">${ticketsInfo}${maxInfo}${tierInfo}</div>
                                ${progressBadge}
                            </div>
                        </div>
                        ${prizesHtml}
                        ${actionBtn}
                    </div>`;
                });
                list.innerHTML = html;
            } catch (e) {
                console.error(e);
                list.innerHTML = '<div class="text-center text-red-400 py-4">โหลดไม่สำเร็จ</div>';
            }
        }

        async function openTicket(ticketId) {
            try { tg.hapticFeedback?.impactOccurred?.('medium'); } catch(e) {}
            showReveal('spinning');

            const apiP = fetch(`/api/mystery-box/ticket/${ticketId}/open`, {
                method: 'POST', headers: {'Content-Type':'application/json'},
                body: JSON.stringify({ initData: tg.initData })
            }).then(r => r.json()).catch((e) => ({ success: false, error: e.message }));

            const minDelay = new Promise(r => setTimeout(r, 1900));
            const [data] = await Promise.all([apiP, minDelay]);

            if (!data || !data.success) {
                showReveal('error', { msg: data?.error || 'เปิดไม่สำเร็จ' });
                return;
            }
            try { tg.hapticFeedback?.notificationOccurred?.('success'); } catch(e) {}
            showReveal('reveal', { prize: data.prize });
        }

        async function claimChannelBox(boxId, btn) {
            if (btn) { btn.disabled = true; btn.textContent = 'กำลังตรวจสอบ...'; }
            try {
                const res = await fetch(`/api/mystery-box/${boxId}/claim-channel`, {
                    method: 'POST', headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({ initData: tg.initData })
                });
                const data = await res.json();
                if (!data.success) {
                    if (btn) { btn.disabled = false; btn.innerHTML = '<i class="ri-check-line"></i> ตรวจสอบและรับสิทธิ์'; }
                    alert(data.error || 'ไม่สามารถรับสิทธิ์ได้');
                    return;
                }
                if (btn) { btn.disabled = true; btn.textContent = '✅ รับสิทธิ์เรียบร้อย'; btn.classList.add('opacity-60'); }
                try { tg.hapticFeedback?.notificationOccurred?.('success'); } catch(e) {}
                await loadMyTickets();
            } catch (e) {
                if (btn) { btn.disabled = false; btn.innerHTML = '<i class="ri-check-line"></i> ตรวจสอบและรับสิทธิ์'; }
                alert('เกิดข้อผิดพลาด');
            }
        }

        function showReveal(state, opts = {}) {
            const modal = document.getElementById('reveal-modal');
            modal.classList.remove('hidden');
            document.body.classList.add('no-scroll');

            if (state === 'spinning') {
                modal.innerHTML = `
                    <div class="text-center px-6">
                        <div class="text-7xl mb-6 shake">🎁</div>
                        <p class="text-white text-lg font-bold mb-1">กำลังเปิดกล่อง...</p>
                        <p class="text-zinc-400 text-sm">ลุ้นรางวัลพิเศษ ✨</p>
                    </div>`;
                return;
            }
            if (state === 'error') {
                modal.innerHTML = `
                    <div class="text-center px-6">
                        <div class="text-6xl mb-4">⚠️</div>
                        <p class="text-red-400 text-lg font-bold mb-4">${_esc(opts.msg || '')}</p>
                        <button onclick="closeReveal()" class="px-6 py-2 rounded-xl bg-zinc-700 text-white font-bold">ปิด</button>
                    </div>`;
                return;
            }
            if (state === 'reveal' && opts.prize) {
                const p = opts.prize;
                fireConfetti();
                const prizeImg = p.imageUrl
                    ? `<img src="${_esc(p.imageUrl)}" alt="" class="w-32 h-32 rounded-2xl object-cover mx-auto mb-4 border-2 border-yellow-400/30">`
                    : `<div class="text-7xl mb-4">🎉</div>`;
                modal.innerHTML = `
                    <div class="glass-card max-w-sm w-[88%] p-6 text-center bounce-in border border-yellow-400/30">
                        <p class="text-yellow-400 text-xs uppercase tracking-widest font-bold mb-3">คุณได้รับ</p>
                        ${prizeImg}
                        <h2 class="text-xl font-black text-white mb-1">${_esc(p.name)}</h2>
                        ${p.description ? `<p class="text-[12px] text-zinc-400 mb-4">${_esc(p.description)}</p>` : '<div class="mb-4"></div>'}
                        ${p.isPhysicalReward ? '<div class="text-[11px] text-orange-300 bg-orange-500/10 rounded-lg px-3 py-2 mb-3 border border-orange-500/30"><i class="ri-truck-line"></i> ของจริง — แอดมินจะติดต่อจัดส่ง</div>' : ''}
                        <button onclick="closeReveal()" class="w-full py-3 rounded-xl bg-gradient-to-r from-yellow-400 to-orange-500 text-black font-bold active:scale-95">
                            ตกลง
                        </button>
                    </div>`;
            }
        }

        function closeReveal() {
            const modal = document.getElementById('reveal-modal');
            modal.classList.add('hidden');
            modal.innerHTML = '';
            document.body.classList.remove('no-scroll');
            // ลบ confetti ที่ค้างอยู่
            document.querySelectorAll('.confetti-piece').forEach(el => el.remove());
            loadMyTickets(); // refresh list
            loadCatalog(); // refresh catalog progress
        }

        function fireConfetti() {
            const emojis = ['🎉', '🎊', '⭐', '✨', '🎁', '💛', '💜'];
            const N = 35;
            for (let i = 0; i < N; i++) {
                const el = document.createElement('div');
                el.className = 'confetti-piece';
                el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                el.style.left = Math.random() * 100 + 'vw';
                el.style.animationDelay = Math.random() * 0.6 + 's';
                el.style.animationDuration = (2.2 + Math.random() * 1.5) + 's';
                document.body.appendChild(el);
                // cleanup หลัง animation จบ
                setTimeout(() => el.remove(), 4500);
            }
        }

        document.getElementById('reveal-modal').addEventListener('click', function(e) {
            if (e.target === this) closeReveal();
        });

        init();
    </script>
</body>
</html>
